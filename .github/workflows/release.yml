name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check manifest version matches tag
        run: |
          MANIFEST_VERSION=$(jq -r .version manifest.json)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "manifest.json version ($MANIFEST_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Build zip
        run: |
          zip -r "a-translate-${GITHUB_REF_NAME}.zip" . \
            -x '.git/*' '.github/*' 'screenshots/*' 'README.md' '*.zip'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: a-translate-${{ github.ref_name }}.zip
          generate_release_notes: true
